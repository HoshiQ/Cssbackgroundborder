<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cssbackgroundborder</title>

  <style>
    body 
    {
      font-family: Times, sans-serif;
      margin-top: 40px;
    }

    .text
    {
      font-size: 28px;
      font-weight: bold;
      padding: 10px;
      width: 400px;
      margin: 10px auto;
    }

    .outer1 
    {
      width: 410px;
      height: 42px;
      background-color: lightblue;
      border: 4px solid red;
      padding: 10px;
      margin: 10px auto;
    }

    .box1 
    {
      background-color: lightblue;
      border: 4px solid red;
      color: black;
      margin: -10px;
      margin-left: -9px;
      padding: 10px;
    }

    .box2 
    {
      background-color: yellow;
      border: 4px solid blue;
      width: 410px;
      color: black;
      border-radius: 15px;
    }

    .box3 
    {
      background-color: seagreen;
      border: 10px dotted purple;
      color: black;
    }
  </style>
</head>

<body>

  <!-- First box with outer red border -->
  <div class="outer1">
    <div class="text box1">Hello World</div>
  </div>

  <!-- Second rounded box -->
  <div class="text box2">Hello World</div>

  <!-- Third dotted box -->
  <div class="text box3">Hello World</div>

</body>
</html>
