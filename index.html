<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Styles</title>
  <style>
    body 
    {
      font-family: Times, sans-serif;
      text-align: center;
      margin-top: 40px;
    }

    .box {
      width: 400px;
      margin: 15px auto;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
    }

    /* First box */
    .box1 {
      background-color: lightblue;
      border: 3px solid red;
      color: darkslategray;
    }

    /* Second box */
    .box2 {
      background-color: yellow;
      border: 3px solid blue;
      color: black;
    }

    /* Third box */
    .box3 {
      background-color: seagreen;
      border: 10px dotted purple;
      color: black;
    }

  </style>
</head>
<body>
  <div class="box box1">Hello World</div>
  <div class="box box2">Hello World</div>
  <div class="box box3">Hello World</div>
</body>
</html>
